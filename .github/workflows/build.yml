name: Build and verify public package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dalamud_url:
        description: HTTPS ZIP of compatible Dalamud API 15 libraries
        default: https://goatcorp.github.io/dalamud-distrib/stg/latest.zip
        type: string
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      tag:
        type: string
        default: ''
      dalamud_url:
        type: string
        default: https://goatcorp.github.io/dalamud-distrib/stg/latest.zip

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify native build process handling on Windows PowerShell 5
        shell: powershell
        run: ./tests/BuildProcessChecks.ps1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify coverage isolation and failure handling
        shell: powershell
        run: ./tests/CoverageProcessChecks.ps1
      - name: Get Dalamud API libraries
        shell: pwsh
        env:
          DALAMUD_URL: ${{ inputs.dalamud_url || vars.DALAMUD_DOWNLOAD_URL || 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' }}
        run: |
          $url = [uri]$env:DALAMUD_URL
          if ($url.Scheme -ne 'https') { throw 'Dalamud libraries must use HTTPS.' }
          $zip = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'dalamud'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $directory
          $libraries = @(Get-ChildItem $directory -Recurse -Filter Dalamud.dll)
          if ($libraries.Count -ne 1) { throw 'Expected exactly one Dalamud.dll.' }
          "DALAMUD_HOME=$($libraries[0].DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build with the locked Dalamud SDK, check and verify binary metadata
        shell: pwsh
        run: ./tools/build.ps1 -DalamudLibPath $env:DALAMUD_HOME -LockedRestore
      - name: Verify complete failure reporting and process exit status
        shell: pwsh
        run: ./tests/CheckRunnerProcessChecks.ps1
      - name: Audit all build dependencies against the official vulnerability feed
        shell: pwsh
        run: ./tools/audit-dependencies.ps1
      - name: Measure uninstrumented helper and device loops
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/performance | Out-Null
          dotnet ./artifacts/checks/LightingChecks.dll --benchmark | Tee-Object artifacts/performance/current.json
          if ($LASTEXITCODE -ne 0) { throw 'Performance checks failed.' }
      - name: Collect structural coverage separately from performance
        shell: pwsh
        run: ./tools/measure-coverage.ps1 -PluginPath ./artifacts/plugin/DualSenseLighting.dll -DalamudLibPath $env:DALAMUD_HOME
      - name: Preserve verification evidence including failed runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence
          path: |
            artifacts/performance/
            artifacts/coverage/
            artifacts/dependency-audit/
          if-no-files-found: warn
          retention-days: 30
      - name: Verify offline enemy boss catalog
        run: python tools/generate-enemy-bosses.py --check
      - name: Check package boundaries
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Package verified SDK output for the public repository
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG) { python tools/package-release.py --tag $env:RELEASE_TAG }
          else { python tools/package-release.py }
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
      - uses: actions/upload-artifact@v7
        with:
          name: official-dalamud-package
          path: |
            artifacts/plugin/DualSenseLighting/latest.zip
            artifacts/plugin/DualSenseLighting/DualSenseLighting.json
            artifacts/plugin/DualSenseLighting/images/icon.png
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: public-plugin-package
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30
