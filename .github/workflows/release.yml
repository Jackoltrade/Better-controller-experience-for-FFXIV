name: Publish a public plugin release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.19.8
        required: true
        type: string
      dalamud_url:
        description: HTTPS ZIP of compatible Dalamud API 15 libraries
        default: https://goatcorp.github.io/dalamud-distrib/stg/latest.zip
        type: string

permissions:
  contents: read

concurrency:
  group: public-test-release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
      tag: ${{ inputs.tag }}
      dalamud_url: ${{ inputs.dalamud_url }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the executing workflow and regression fixtures
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify release recovery without network access
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: python -m unittest discover -s tests -p "test_release_workflow.py" -v
      - uses: actions/download-artifact@v8
        with:
          name: public-plugin-package
          path: release
      - name: Publish ZIP and update the installer feeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if release_state=$(gh release view "$RELEASE_TAG" --json isPrerelease,isDraft --jq '[.isPrerelease, .isDraft] | @tsv' 2>/dev/null); then
            case "$release_state" in
              $'true\ttrue'|$'false\ttrue'|$'true\tfalse') finalize_release=true ;;
              $'false\tfalse') finalize_release=false ;;
              *) echo 'Invalid existing release state.' >&2; exit 1 ;;
            esac
            existing_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            compare_dir=$(mktemp -d)
            trap 'rm -rf -- "$compare_dir"' EXIT
            missing=()
            for asset in release/latest.zip release/latest-ja.zip release/SHA256SUMS.txt release/release-summary.json; do
              asset_name=${asset##*/}
              if grep -Fxq "$asset_name" <<< "$existing_assets"; then
                gh release download "$RELEASE_TAG" --pattern "$asset_name" --dir "$compare_dir"
                if ! cmp -s "$asset" "$compare_dir/$asset_name"; then
                  echo "Existing $asset_name differs; use the original build artifact or a new version tag." >&2
                  exit 1
                fi
              else
                missing+=("$asset")
              fi
            done
            if ((${#missing[@]})); then gh release upload "$RELEASE_TAG" "${missing[@]}"; fi
            if [ "$finalize_release" = true ]; then
              gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
            fi
          else
            gh release create "$RELEASE_TAG" release/latest.zip release/latest-ja.zip release/SHA256SUMS.txt release/release-summary.json --verify-tag --title "Better controller experience for FFXIV $RELEASE_TAG" --notes "See the README for compatibility, installation and known limitations."
          fi
          if ! gh release view plugin-repository >/dev/null 2>&1; then
            target_sha=$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq .sha)
            gh release create plugin-repository --target "$target_sha" --title "Plugin repository" --notes "Installer metadata for public plugin builds."
          fi
          gh release upload plugin-repository release/pluginmaster.json release/pluginmaster-ja.json --clobber
